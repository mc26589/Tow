name: Local Researcher (Event & Long-tail)

on:
  # Disabled scheduled runs: pseo-builder.yml and blog-agent.yml were consolidated into
  # seo-4day-cycle.yml, so writing weekly trends to local_trends is unused and burns tokens.
  # schedule:
  #   - cron: '0 3 * * 0' # Runs weekly on Sundays before pSEO builder to conserve tokens
  workflow_dispatch: # Allow manual trigger

jobs:
  research:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-progress --no-audit --no-fund --loglevel=error

      - name: Run Local Researcher Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: npm run agent:researcher
        
      - name: Log Results
        run: echo "Research cycle completed."

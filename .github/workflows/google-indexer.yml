name: Daily Google Indexer Sync

on:
  schedule:
    # Runs at 08:30 UTC every day.
    # Google's indexing API quota resets at midnight Pacific Time (08:00 UTC).
    - cron: '30 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  index-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./google-indexer
        run: npm ci --no-progress --no-audit --no-fund --loglevel=error

      - name: Recreate Service Account Key
        working-directory: ./google-indexer
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = (process.env.GOOGLE_INDEXING_SERVICE_ACCOUNT || "").trim();
            if (!raw) {
              console.error("Missing GOOGLE_INDEXING_SERVICE_ACCOUNT secret");
              process.exit(1);
            }
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch {
              try {
                parsed = JSON.parse(Buffer.from(raw, "base64").toString("utf8"));
              } catch (e) {
                console.error("Invalid GOOGLE_INDEXING_SERVICE_ACCOUNT JSON/base64:", e.message);
                process.exit(1);
              }
            }
            if (typeof parsed.private_key === "string") {
              parsed.private_key = parsed.private_key.replace(/\\n/g, "\n");
            }
            fs.writeFileSync("service-account-keys.json", JSON.stringify(parsed, null, 2), "utf8");
          '

      - name: Run Indexing Sync
        working-directory: ./google-indexer
        run: node sync.js

      - name: Commit and push updated cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git diff --quiet google-indexer/indexed_cache.json; then
            echo "No new pages indexed. Cache is up to date."
          else
            git add google-indexer/indexed_cache.json
            git commit -m "chore: update google indexing cache [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || {
                echo "Rebase failed — aborting to avoid conflict markers."
                git rebase --abort 2>/dev/null || true
                exit 1
              }
              git push && break
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi

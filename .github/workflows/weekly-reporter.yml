name: Weekly Executive Reporter

on:
  schedule:
    - cron: '0 6 * * 0' # Runs every Sunday at 06:00 UTC (08:00 Israel time)
  workflow_dispatch:

jobs:
  run-reporter-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch git log history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-progress --no-audit --no-fund --loglevel=error

      - name: Run Executive Reporter Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx tsx scripts/agent-reporter.ts

      - name: Publish Report to Job Summary
        run: |
          REPORT_FILE=$(ls -t דוח-שבועי-*.md 2>/dev/null | head -n 1)
          if [ -n "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Weekly Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-executive-report
          path: דוח-שבועי-*.md
          if-no-files-found: warn
          retention-days: 30
